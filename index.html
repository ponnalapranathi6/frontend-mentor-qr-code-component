<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | QR Code Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit&display=swap" rel="stylesheet">
</head>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(223, 234, 247);
    }
    .container {
        width: 330px;
        height: 500px;
        background-color: white;
        border-radius: 10px;
        padding: 15px;
        margin: auto;
        text-align: center;
    }
    .box {
        background-color: rgb(75, 149, 246);
        justify-content: center;
        height: 250px;
        padding: 30px;
        border-radius: 10px;
        text-align: center;
    }
    h6 {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 22px;
        margin: 25px 0 5px;
    }
    p {
        font-family: 'Outfit', sans-serif;
        font-weight: 400;
        color: grey;
        margin: 20px;
        line-height: 1.4;
    }
</style>
<body>
    <div class="container">
        <div class="box">
            <img src="qr-removebg-preview.png" width="250px"  height="250px" >
        </div>
        <h6>Improve your front-end <br>skills by building projects</h6>
        <p>
            Scan the QR Code to visit Frontend<br> Mentor and make your coding skills to the next level
        </p>
    </div>
</body>
</html>
